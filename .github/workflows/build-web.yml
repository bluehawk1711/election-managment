name: Build Web

# Static export of the Expo app — no Next.js, no monorepo packages: this
# project is a single Expo app and the web build is `expo export` only.
# Deploy by pointing any static host (Firebase Hosting, Vercel, Netlify) at
# the uploaded artifact's `dist/` directory.
on:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  build:
    name: Export web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('mobile/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The cheapest useful gate: the web export runs tsc as part of bundling
      # only for files it imports, so typecheck the whole project explicitly.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Write .env file
        run: |
          # Quoted terminator: secrets are substituted by Actions
          # before bash runs, and the quotes stop the shell from also
          # expanding any `$` that happens to appear inside a secret.
          cat > .env << 'ENVEOF'
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_DATABASE_URL=${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
          EXPO_PUBLIC_FIREBASE_LINK_URL=${{ secrets.EXPO_PUBLIC_FIREBASE_LINK_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_ADMIN_API_URL=${{ secrets.EXPO_PUBLIC_ADMIN_API_URL }}
          ENVEOF

      # ── Environment guard ──────────────────────────────────────────────
      # See `build-android.yml` for the full explanation. Short version: an
      # empty secret inlines `undefined`, the web build still succeeds, and the
      # deployed app throws on its first database read. Fail the build instead.
      - name: Verify the app env is complete
        run: |
          missing=0
          for name in \
            EXPO_PUBLIC_FIREBASE_API_KEY \
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN \
            EXPO_PUBLIC_FIREBASE_PROJECT_ID \
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET \
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            EXPO_PUBLIC_FIREBASE_APP_ID \
            EXPO_PUBLIC_FIREBASE_DATABASE_URL \
            EXPO_PUBLIC_ADMIN_API_URL
          do
            value=$(grep -E "^${name}=" .env | cut -d= -f2-)
            if [ -z "$value" ]; then
              echo "::error::$name is empty. Set it with: gh secret set $name"
              missing=1
            fi
          done

          URL=$(grep -E '^EXPO_PUBLIC_FIREBASE_DATABASE_URL=' .env | cut -d= -f2-)
          case "$URL" in
            https://*.firebasedatabase.app|https://*.firebaseio.com) ;;
            *)
              echo "::error::EXPO_PUBLIC_FIREBASE_DATABASE_URL is not a Realtime Database URL: '$URL'"
              missing=1
              ;;
          esac

          # Account creation finishes by calling Campaign HQ's claims route;
          # without this origin the mobile form refuses to create anything.
          ADMIN_URL=$(grep -E '^EXPO_PUBLIC_ADMIN_API_URL=' .env | cut -d= -f2-)
          case "$ADMIN_URL" in
            https://*) ;;
            *)
              echo "::error::EXPO_PUBLIC_ADMIN_API_URL must be Campaign HQ's https origin (no /api suffix): '$ADMIN_URL'"
              missing=1
              ;;
          esac

          [ "$missing" -eq 0 ] || exit 1
          echo "App env complete. Realtime Database host: ${URL#https://}; Campaign HQ: ${ADMIN_URL#https://}"

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-export-${{ github.sha }}
          path: mobile/dist
          # Free-tier artifact storage (500 MB) is shared account-wide.
          retention-days: 3
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## Web export complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Output** | \`dist/\` (static) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Point any static host at the artifact's contents." >> $GITHUB_STEP_SUMMARY
