name: Build Production App Bundle

on:
  workflow_dispatch:

concurrency:
  group: android-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  PNPM_VERSION: "11"

jobs:
  build:
    name: "Build Production AAB"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: mobile

    steps:
      # ── Free disk space (fixes "No space left on device") ──────────────
      - name: Free disk space
        # Runs before checkout, so it can't use the job's `mobile/` default.
        working-directory: ${{ github.workspace }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/heroku /usr/lib/jvm/temurin-8* /usr/lib/jvm/temurin-11*
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      # ── Setup ──────────────────────────────────────────────────────────
      # fetch-depth: 0 — the versionCode below is derived from the commit
      # count, which a shallow depth-1 clone would report as 1 forever.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('mobile/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Java / Gradle ──────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/pnpm-lock.yaml', 'mobile/app.json', 'mobile/app.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Environment ────────────────────────────────────────────────────
      - name: Write .env file
        run: |
          # Quoted terminator: secrets are substituted by Actions
          # before bash runs, and the quotes stop the shell from also
          # expanding any `$` that happens to appear inside a secret.
          cat > .env << 'ENVEOF'
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_DATABASE_URL=${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
          EXPO_PUBLIC_FIREBASE_LINK_URL=${{ secrets.EXPO_PUBLIC_FIREBASE_LINK_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          ENVEOF

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      # ── Package guard ──────────────────────────────────────────────────
      - name: Verify applicationId
        run: |
          EXPECTED=$(grep -oE '"packageName": *"[^"]+"' constants/brand.json | sed -E 's/.*"packageName": *"([^"]+)".*/\1/')
          APP_ID=$(grep -o "applicationId '[^']*'" android/app/build.gradle | head -1 | cut -d"'" -f2)
          echo "applicationId = $APP_ID (expected $EXPECTED)"
          echo "package=$EXPECTED" >> $GITHUB_ENV
          if [ -z "$EXPECTED" ] || [ "$APP_ID" != "$EXPECTED" ]; then
            echo "::error::Wrong applicationId '$APP_ID' — expected '$EXPECTED' (check constants/brand.json)"
            exit 1
          fi

      # ── Version code (monotonic, Play-safe) ────────────────────────────
      # Commit count, same scheme as the APK workflow so both artifacts share
      # one numbering line. Android/Play only installs a build whose
      # versionCode is >= the installed one — it must never go backwards.
      - name: Bump versionCode
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$((COMMIT_COUNT * 100 + ${{ github.run_attempt }}))
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          echo "versionCode = $VERSION_CODE (commit $COMMIT_COUNT, attempt ${{ github.run_attempt }})"

      # ── Release signing (Gradle-level, signed inline by bundleRelease) ─
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS=android/app/release.keystore

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "Keystore decoded from ANDROID_KEYSTORE_BASE64 secret"
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty — set the ANDROID_* secrets in the 'production' environment"
            exit 1
          fi

          # ── Fail fast: validate credentials BEFORE the 40-minute build ──
          for VAR in STORE_PASS ALIAS KEY_PASS; do
            if [ -z "${!VAR}" ]; then
              echo "::error::$VAR is empty — set the ANDROID_* secrets in the 'production' environment"
              exit 1
            fi
          done
          if ! keytool -list -keystore "$KS" \
                 -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore credentials check failed — ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS does not match this keystore"
            exit 1
          fi
          echo "Signing credentials verified against keystore (alias: $ALIAS)"

          cat >> android/app/build.gradle <<'EOF'

          // ── Release signing (injected by CI from secrets) ──
          android {
              signingConfigs {
                  release {
                      storeFile file(findProperty('ANDROID_KEYSTORE_FILE') ?: 'release.keystore')
                      storePassword findProperty('ANDROID_KEYSTORE_PASSWORD') ?: ''
                      keyAlias findProperty('ANDROID_KEY_ALIAS') ?: ''
                      keyPassword findProperty('ANDROID_KEY_PASSWORD') ?: ''
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          echo "Signing config injected into app/build.gradle"

      # ── Build App Bundle ───────────────────────────────────────────────
      # arm64-v8a only: Play distributes it for every device via the bundle,
      # and skipping armeabi-v7a/x86 roughly halves native build time.
      # lintVitalRelease is disabled — Play Console runs its own pre-launch
      # checks and it adds ~5 minutes on top.
      - name: Build release App Bundle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.lint.enabled=false \
            -x lintVitalRelease \
            -PANDROID_KEYSTORE_FILE="${{ github.workspace }}/mobile/android/app/release.keystore" \
            -PANDROID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PANDROID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PANDROID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --no-daemon \
            --parallel \
            --build-cache

      - name: Disk usage after build
        if: always()
        run: df -h /

      # ── Verify signature ───────────────────────────────────────────────
      - name: Verify App Bundle signature
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          jarsigner -verify "$AAB"
          echo "AAB is signed with the upload keystore"

      # ── Cleanup — never let the keystore leak into caches/artifacts ────
      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Find AAB file
        id: find-aab
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "::error::No release .aab found"
            exit 1
          fi
          # `upload-artifact` does NOT inherit the job's `working-directory:
          # mobile`, so the output must be repo-root relative.
          echo "aab_path=mobile/$AAB_PATH" >> $GITHUB_OUTPUT
          echo "Found App Bundle: mobile/$AAB_PATH"

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-bundle-${{ github.sha }}
          path: ${{ steps.find-aab.outputs.aab_path }}
          # Production AABs are the biggest artifact we produce; the free tier
          # shares 500 MB across the whole account, so keep the window tight.
          retention-days: 14
          if-no-files-found: error

      # ── Summary ────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## Production Android App Bundle Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | ${{ env.package }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Format** | signed .aab (upload keystore) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bundle** | \`${{ steps.find-aab.outputs.aab_path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
